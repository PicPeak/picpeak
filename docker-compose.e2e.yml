# Isolated stack for the Playwright E2E suite (issue 1500). Driven by
# scripts/e2e.sh, locally and in CI.
#
# Its own compose project, host ports (72xx) and no fixed container names, so
# it runs next to the dev stack (71xx) without touching it. Postgres lives on a
# tmpfs: every `up` starts from an empty database, the migrations seed the
# admin below, and nothing a previous run changed can leak into the next one.
#
# OIDC is off because a fresh database has no OIDC settings. The auth rate
# limit is raised by the runner after boot, not here: it is an app_settings
# row, not an environment variable.
name: picpeak-e2e

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # JWT_SECRET, the seeded admin's ADMIN_PASSWORD and DB_PASSWORD are
    # generated per run by scripts/e2e.sh into this git-ignored file, so no
    # credential is committed. The admin's username and email are the
    # migration defaults, admin / admin@example.com.
    env_file:
      - .e2e/backend.env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_CLIENT=pg
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=picpeak
      - DB_NAME=picpeak_e2e
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SMTP_SECURE=false
      - EMAIL_FROM=noreply@picpeak.local
      - FRONTEND_URL=http://localhost:7200
      - ADMIN_URL=http://localhost:7200
      - TZ=UTC
      - STORAGE_PATH=/app/storage
      # external-media-gallery.spec.ts copies its fixtures into the host side of
      # this mount (scripts/e2e.sh creates it). Kept outside STORAGE_PATH, which
      # the entrypoint chowns and a read-only mount would make it fail on.
      - EXTERNAL_MEDIA_ROOT=/external-media
      - EXTERNAL_MEDIA_WATCH=false
      # The webhook spec posts to the receiver on the private compose network.
      - WEBHOOK_ALLOW_PRIVATE_URLS=true
      # The customer portal spec accepts its invitation from the API response
      # instead of the email. Never set outside a test stack.
      - PICPEAK_ECHO_INVITE_TOKEN=1
    volumes:
      - ./.e2e/external-media:/external-media:ro
    ports:
      - "127.0.0.1:7201:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=picpeak
      - POSTGRES_PASSWORD=${E2E_DB_PASSWORD:?generated by scripts/e2e.sh}
      - POSTGRES_DB=picpeak_e2e
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picpeak -d picpeak_e2e"]
      interval: 2s
      timeout: 2s
      retries: 30

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    ports:
      - "127.0.0.1:7200:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "127.0.0.1:7225:8025"

  webhook-receiver:
    build:
      context: ./dev/webhook-receiver
      dockerfile: Dockerfile
    environment:
      - PORT=8888
      - RING_SIZE=200
    ports:
      - "127.0.0.1:7207:8888"
