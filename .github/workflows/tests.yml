name: Tests

# Runs the backend Jest suite and the frontend Vitest suite on every PR.
# Both suites already exist and cover the CRM service layer (quoteService,
# contractService, invoiceService.*, customerHoursService, eventService.
# calendar) plus the photo / settings / OG / auth surface — wiring them
# into CI makes regressions visible at PR time instead of post-merge.
#
# Triggers on any change that could affect either suite. The backend
# job intentionally omits frontend paths and vice versa so unrelated
# PRs don't pay both build costs.

on:
  push:
    branches: [main, beta, stable]
  pull_request:
    branches: [main, beta, stable]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Installed by the media tools step; part of its apt cache key.
      MEDIA_APT_PACKAGES: build-essential ffmpeg libimage-exiftool-perl sqlite3
      # S3-compatible store for the backup/restore S3 suites (started below).
      # MinIO no longer publishes images on Docker Hub or quay.io; Chainguard's
      # free build is pinned by digest. The free tier only promises :latest, so
      # an old digest can disappear upstream. "Start MinIO" then falls back to
      # MINIO_FALLBACK_IMAGE with a warning instead of failing every run; copy
      # the RepoDigest the warning prints here to pin again.
      MINIO_IMAGE: cgr.dev/chainguard/minio@sha256:fb893e36fc369d41e92f678b17ec27378fa5bf0576aeef7ac15460c13629ab5a
      MINIO_FALLBACK_IMAGE: cgr.dev/chainguard/minio:latest
      # The generation suites sign with these fixed keys, so the server's
      # root account uses them and every S3 suite shares one login.
      MINIO_ROOT_USER: owned-generation-access
      MINIO_ROOT_PASSWORD: owned-generation-secret
    # Runaway guard for the whole job, not a performance budget. The suite is
    # the only one that boots Postgres and runs the full integration set, so
    # it is the only one long enough for runner contention to matter, and it
    # keeps growing: ~3 minutes when the cap was first raised to 20, 10-11.5
    # on main now. On a degraded runner every suite runs several times slower,
    # and at 20 that cancelled runs with no failing test (twice in a row on
    # PR 1540, and a push to main on 2026-10-02).
    #
    # The budget that normally fires is the 35 on the jest step below. This
    # one sits five minutes above it, and the steps before jest (checkout,
    # npm ci, the Postgres service) take about one, so it fires first only
    # when those steps themselves run more than five minutes. ml keeps 10;
    # frontend has its own note below.
    timeout-minutes: 40

    # The .picpeak restore suites gate their real-Postgres cases behind
    # PICPEAK_PG_TEST_URL and `describe.skip` themselves out when it is
    # unset — so until now they never ran here. That hid the half that
    # matters: sequence resync, operator/role preservation across a
    # cross-instance restore, and (with #1041) whether a SQLite-shaped
    # row actually lands in Postgres with the right STORED VALUES rather
    # than merely not throwing. Everything else in the suite still runs
    # on SQLite; this service only un-gates those cases.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: picpeak
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: picpeak_test
        options: >-
          --health-cmd "pg_isready -U picpeak -d picpeak_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Not a `services:` entry: a service container cannot be given a command,
      # and MinIO needs `server /data`. /data is a tmpfs because MinIO renames
      # across its data directory, which an overlay filesystem refuses; 1 GiB
      # holds the suites' test objects, where the default is half the RAM.
      # Every suite creates and deletes its own bucket, so no bucket is made
      # here.
      - name: Start MinIO
        timeout-minutes: 5
        run: |
          image="$MINIO_IMAGE"
          if ! docker pull --quiet "$image"; then
            image="$MINIO_FALLBACK_IMAGE"
            docker pull --quiet "$image"
            digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
            echo "::warning title=MinIO pin unavailable::$MINIO_IMAGE could not be pulled; ran $digest instead. Pin that digest as MINIO_IMAGE in tests.yml."
          fi
          docker run -d --name minio -p 9000:9000 \
            --mount type=tmpfs,destination=/data,tmpfs-mode=1777,tmpfs-size=1g \
            -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD \
            "$image" server /data
          for attempt in $(seq 1 60); do
            curl -sf --max-time 2 http://127.0.0.1:9000/minio/health/ready && exit 0
            sleep 1
          done
          docker logs minio
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: ./backend
        run: npm ci

      - name: Pick the apt package cache key
        id: apt-cache-key
        # The .debs the step below downloads are cached, so a slow mirror only
        # costs the run that fills the cache. The key carries the runner image
        # (its installed base decides which .debs apt fetches) and the package
        # list; restore-keys seeds a new image with the previous image's .debs,
        # and apt then fetches only the packages that changed.
        run: |
          list=$(printf '%s' "$MEDIA_APT_PACKAGES" | sha256sum | cut -c1-12)
          echo "prefix=apt-debs-${ImageOS}-${list}-" >> "$GITHUB_OUTPUT"
          echo "key=apt-debs-${ImageOS}-${list}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Restore the apt package cache
        uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: ${{ steps.apt-cache-key.outputs.key }}
          restore-keys: ${{ steps.apt-cache-key.outputs.prefix }}

      - name: Build the optional media process guard and install the media tools
        working-directory: ./backend
        # Normally about 30 s. A stalled apt mirror once sat here silently
        # for 35 minutes, the job hit its cap during Jest and the check read
        # "cancelled" (stable release PR 3.135.2). Bounded on the step, and
        # apt retries and times out instead of waiting on a dead socket.
        # A mirror that trickles (30-50 kB/s for the ~100 MB ffmpeg pulls in,
        # stable release PR 3.135.3 and PR 2232) never trips that timeout, so
        # the .debs come from the cache above. `apt-get update` stays: it is
        # fast and keeps the install on current versions. autoclean drops the
        # .debs the new indexes no longer list, so the cache does not grow.
        timeout-minutes: 10
        run: |
          mkdir -p ~/apt-debs/partial
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::Archives=$HOME/apt-debs -o APT::Keep-Downloaded-Packages=true"
          sudo apt-get $apt_opts update
          sudo apt-get $apt_opts install -y $MEDIA_APT_PACKAGES
          sudo apt-get $apt_opts autoclean
          # apt writes as root; the cache post step tars as the runner user.
          sudo rm -rf ~/apt-debs/partial ~/apt-debs/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-debs
          npm run build:native

      # portableRestoreWorkerPg.test.js restores into a database it requires to
      # be new, empty and disposable, and checks the name has this shape. The
      # runner image ships the PostgreSQL client, so createdb needs no apt
      # package; the job's Postgres service goes away with the job, which is
      # the dropdb. Never the shared picpeak_test database.
      - name: Create the PostgreSQL worker test database
        env:
          PGPASSWORD: testpass
        run: |
          name="picpeak_owned_worker_$(openssl rand -hex 8)_main"
          createdb -h 127.0.0.1 -U picpeak "$name"
          echo "PICPEAK_PG_WORKER_TEST_URL=postgres://picpeak:testpass@127.0.0.1:5432/$name" >> "$GITHUB_ENV"

      - name: Run Jest suite
        working-directory: ./backend
        # On the step, not only on the job: a job that hits its own cap is
        # reported as "cancelled", which reads like someone cancelled it. A
        # step that hits its cap FAILS with "The action 'Run Jest suite' has
        # timed out after 35 minutes", so running out of time is told apart
        # from a cancellation in the checks list and in the log.
        timeout-minutes: 35
        env:
          # MinIO (started above) un-gates the S3 suites: backup-s3,
          # storageBackend and imageProcessor.storage read TEST_S3_* and skip
          # unless SKIP_S3_TESTS is 'false' (jest.setup.js defaults it to
          # 'true'); the S3 generation and restore-worker suites read
          # PICPEAK_GENERATION_S3_TEST_URL and set their own STORAGE_S3_*.
          SKIP_S3_TESTS: 'false'
          TEST_S3_ENDPOINT: 'http://127.0.0.1:9000'
          TEST_S3_ACCESS_KEY: owned-generation-access
          TEST_S3_SECRET_KEY: owned-generation-secret
          PICPEAK_GENERATION_S3_TEST_URL: 'http://127.0.0.1:9000'
          # Un-gates the real-Postgres cases in the .picpeak restore suites
          # (see the `services:` note above). Absent it they silently skip.
          PICPEAK_PG_TEST_URL: 'postgres://picpeak:testpass@127.0.0.1:5432/picpeak_test'
        run: npx jest --ci

  frontend:
    runs-on: ubuntu-latest
    # 10 used to be plenty. With ~480 test files the job takes 6 to 10
    # minutes (Vitest alone 9.5 on a slow runner), and on 2026-10-29 five
    # runs were cancelled at 10 with every test passing so far. 20 leaves
    # room for a degraded runner while a hung run still ends.
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      - name: Lint frontend (including Rules of Hooks)
        working-directory: ./frontend
        run: npm run lint

      - name: Run Vitest suite
        working-directory: ./frontend
        run: npm test -- --run

  nginx:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        # Match the two shipped frontend Dockerfiles.
        image: ['nginx:1.28-alpine', 'nginx:1.30-alpine']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify token-safe nginx logging
        env:
          NGINX_TEST_IMAGE: ${{ matrix.image }}
        run: python3 tests/nginx/test_request_logging.py

  # Optional face-detection sidecar (#1074). Runs on every PR regardless of
  # whether the feature is enabled anywhere — these tests need no model
  # weights (they stub the pipeline out) and cover the auth boundary, the
  # request guards and the alignment geometry, which is where a mistake is a
  # security problem or a silent accuracy problem rather than a visible bug.
  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches ml/Dockerfile's base image, so a wheel that resolves here
          # resolves in the image too.
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt

      - name: Install ml deps
        working-directory: ./ml
        run: pip install -r requirements.txt pytest httpx

      - name: Run pytest suite
        working-directory: ./ml
        run: python -m pytest tests/ -q
