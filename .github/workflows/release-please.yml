name: Release Please

on:
  push:
    branches: [stable]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
      release_id: ${{ steps.release.outputs.id }}
      version: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
    steps:
      # No GITHUB_TOKEN fallback: the v* tag-creation ruleset only lets the
      # release actor create tags, so a fallback run could not tag a merged
      # release PR. Fail loudly here instead.
      - name: Require a working RELEASE_PLEASE_TOKEN
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN is not set. Add the release actor's PAT (see docs/RELEASE_IMAGE_SECURITY.md); releases cannot be cut without it."
            exit 1
          fi
          if ! GH_TOKEN="$RELEASE_PLEASE_TOKEN" gh api "repos/$GITHUB_REPOSITORY" --silent; then
            echo "::error::RELEASE_PLEASE_TOKEN was rejected (expired, revoked or missing repository access). Renew it (see docs/RELEASE_IMAGE_SECURITY.md)."
            exit 1
          fi

      - name: Run Release Please
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          # Dedicated token so the release PR runs CI + can auto-merge without a
          # manual review (#719). Required: checked by the step above.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: stable

      # NOTE: stable release PRs are intentionally NOT auto-merged here
      # anymore. Fixes accumulate in the rolling release PR and are cut as
      # ONE patch version per day by release-stable-daily.yml (18:00 UTC,
      # or on demand via workflow_dispatch / a manual merge of the release
      # PR). Beta keeps instant releases — see release-please-beta.yml —
      # because same-day reporter verification depends on it.

      - name: Output Release Info
        if: ${{ steps.release.outputs.release_created }}
        run: |
          echo "## Release Created! " >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ steps.release.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Docker images will be built and tagged with this version." >> $GITHUB_STEP_SUMMARY

  # Same-commit reusable workflow: exact outputs from the pinned action, not
  # an arbitrary tag/release event. No RELEASE_PLEASE_TOKEN is passed onward.
  publish-images:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      actions: read
      packages: write
      security-events: write
    uses: ./.github/workflows/docker-build.yml
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}
      release_sha: ${{ needs.release-please.outputs.sha }}
      release_id: ${{ needs.release-please.outputs.release_id }}
    # Pass only these names; environment-scoped values take precedence.
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Best-effort "What's New" highlights on the freshly-created release. Runs in
  # this same workflow run (not a `release:` trigger) because release-please
  # creates the release with GITHUB_TOKEN, which never starts new workflow runs.
  whatsnew:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: write   # edit the release body
      models: read       # GitHub Models (free tier)
    uses: ./.github/workflows/whatsnew-highlights.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
