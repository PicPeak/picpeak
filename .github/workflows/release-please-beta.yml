name: Release Please (Beta)

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          # A dedicated token (fine-grained PAT) makes the release PR run CI
          # automatically (no "workflows awaiting approval") and lets it be
          # merged without a manual review. Falls back to GITHUB_TOKEN so the
          # workflow still works before the secret is added (#719).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config-beta.json
          manifest-file: .release-please-manifest-beta.json
          target-branch: main

      # Auto-approve + enable auto-merge on the open release PR so betas publish
      # with no manual clicks. Approval uses GITHUB_TOKEN (github-actions[bot]) —
      # a different identity than the PR author (RELEASE_PLEASE_TOKEN) — so it is
      # a valid review (requires the org's "Allow GitHub Actions to approve pull
      # requests" + the repo's "Allow auto-merge"). Only meaningful when a PAT is
      # set: without it the PR is bot-authored and can't be self-approved, so we
      # skip and leave today's manual flow. Best-effort — never blocks the run.
      - name: Auto-approve and enable auto-merge on the release PR
        if: ${{ steps.release.outputs.release_created != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PAT: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # This job has no checkout, so gh can't infer the repo from a git
          # remote — set it explicitly (same pattern as whatsnew, 2a5f0a8).
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$RELEASE_PAT" ]; then
            echo "RELEASE_PLEASE_TOKEN not set — skipping auto-merge (manual review still required)."
            exit 0
          fi
          # Strict selection: `gh pr list --head` matches the branch NAME only,
          # so a fork PR can spoof `release-please--branches--main`. Pin the
          # base to main AND require a same-repo head (a fork PR is
          # cross-repository), require exactly one such PR, and check that it
          # was opened by the identity holding RELEASE_PLEASE_TOKEN (release-
          # please authors the PR as the PAT owner). Anything else fails
          # closed — same shape as release-stable-daily.yml.
          read -r count pr pr_author < <(gh pr list \
            --base main \
            --head release-please--branches--main \
            --state open \
            --json number,isCrossRepository,author \
            --jq '[.[] | select(.isCrossRepository == false)] | "\(length) \(.[0].number // "-") \(.[0].author.login // "-")"')
          if [ "$count" -eq 0 ]; then
            echo "No open same-repo release PR to auto-merge."
            exit 0
          fi
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one same-repo release PR on main, found $count — refusing to approve."
            exit 1
          fi
          pat_login=$(GH_TOKEN="$RELEASE_PAT" gh api user --jq .login)
          if [ -z "$pat_login" ] || [ "$pr_author" != "$pat_login" ]; then
            echo "::error::Release PR #$pr was opened by '$pr_author', not by the release token owner — refusing to approve."
            exit 1
          fi
          # Bind approval and merge to what the release token produced, not to
          # the branch name: every commit on the PR must be authored AND
          # committed by the token owner, and the review and the merge are tied
          # to the head SHA verified here, so a later push is not covered.
          # Returns 0 and prints the head SHA when it verifies, 1 when a commit
          # is from anyone else, 2 when the head moved while it was being read
          # (try again), 3 when the PR could not be read at all.
          verify_release_head() {
            local pr="$1" head commits count last foreign after
            head=$(gh pr view "$pr" --json headRefOid --jq .headRefOid) || return 3
            commits=$(gh api --paginate "repos/$GH_REPO/pulls/$pr/commits?per_page=100" \
              --jq '.[] | "\(.sha) \(.author.login // "-") \(.committer.login // "-")"') || return 3
            count=$(printf '%s\n' "$commits" | grep -c . || true)
            last=$(printf '%s\n' "$commits" | tail -n 1 | cut -d' ' -f1)
            foreign=$(printf '%s\n' "$commits" | awk -v login="$pat_login" 'NF && ($2 != login || $3 != login) { print $1 }')
            [ "$count" -gt 0 ] || return 3
            after=$(gh pr view "$pr" --json headRefOid --jq .headRefOid) || return 3
            if [ "$after" != "$head" ] || [ "$last" != "$head" ]; then
              return 2
            fi
            # The pulls commits endpoint stops at 250; a release PR has a handful.
            if [ -z "$pat_login" ] || [ -z "$head" ] || [ "$count" -ge 250 ]; then
              return 3
            fi
            if [ -n "$foreign" ]; then
              return 1
            fi
            echo "$head"
          }
          verified=0
          head=$(verify_release_head "$pr") || verified=$?
          if [ "$verified" = 2 ]; then
            echo "Release PR #$pr moved while it was being checked — the next push to main tries again."
            exit 0
          fi
          if [ "$verified" = 3 ]; then
            echo "::error::Could not read release PR #$pr — refusing to approve."
            exit 1
          fi
          if [ "$verified" != 0 ]; then
            GH_TOKEN="$RELEASE_PAT" gh pr merge "$pr" --disable-auto || true
            echo "::error::Release PR #$pr carries a commit not authored and committed by the release token owner — auto-merge turned off, refusing to approve."
            exit 1
          fi
          # Approve as github-actions[bot] (GITHUB_TOKEN) — a different identity
          # than the PR author (the PAT) — so it counts as a valid review. The
          # review names the verified head, so it does not cover a later push.
          gh api "repos/$GH_REPO/pulls/$pr/reviews" -f commit_id="$head" -f event=APPROVE \
            -f body="Automated approval — release-please version bump + changelog (#719)." > /dev/null || true
          # Enable auto-merge as the PAT so the eventual merge commit is
          # attributed to a real identity. If enabled via GITHUB_TOKEN the merge
          # push is suppressed by recursion prevention and the follow-up run that
          # cuts the tag/release never fires (#719).
          GH_TOKEN="$RELEASE_PAT" gh pr merge "$pr" --squash --auto --match-head-commit "$head" || true

      - name: Output Release Info
        if: ${{ steps.release.outputs.release_created }}
        # Release-please outputs derive from PR titles/commits: pass them as
        # env, never as ${{ }} inside run:, so they are data, not shell code.
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          echo "## Beta Release Created!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${TAG_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Docker images will be built and tagged with this beta version." >> $GITHUB_STEP_SUMMARY

  # Best-effort "What's New" highlights on the freshly-created release. Runs in
  # this same workflow run (not a `release:` trigger) because release-please
  # creates the release with GITHUB_TOKEN, which never starts new workflow runs.
  whatsnew:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: write   # edit the release body
      models: read       # GitHub Models (free tier)
    uses: ./.github/workflows/whatsnew-highlights.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

