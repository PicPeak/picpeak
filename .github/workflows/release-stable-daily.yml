name: Cut Stable Release (daily batch)

# Stable fixes accumulate in release-please's rolling release PR instead of
# each cutting its own patch version (the old per-merge auto-merge produced
# e.g. 3.45.8 AND 3.45.9 on the same day). This workflow merges the open
# stable release PR once a day, so a day of N bugfixes ships as ONE version
# with all N changelog entries — and one Docker build instead of N.
#
# - schedule only fires from the default branch (main); the stable copy of
#   this file is inert and exists to keep the branches in sync.
# - Need a release NOW? Run this via workflow_dispatch, or merge the
#   release PR by hand — the schedule is a default, not a gate.
# - Approval/merge mechanics mirror the old inline step (#719): approve as
#   github-actions[bot] (GITHUB_TOKEN, a valid distinct reviewer), enable
#   auto-merge as the PAT so the merge attributes to a real identity and
#   triggers the tag-cutting run. --auto waits for green checks.
# - Stable dismisses stale reviews. A stable merge after the daily approval
#   makes release-please push to the release PR, which dismisses the
#   approval: auto-merge stays on but waits for a review that never comes
#   (3.135.0 hung for two days). The hourly run re-approves a release PR
#   the daily run already set to auto-merge.
# - A required check that failed or was cancelled on the release PR's head
#   blocks auto-merge just as silently, and nothing reruns it until the next
#   push (3.135.2 hung for two days on a backend job a stalled apt mirror ran
#   into its timeout). The hourly run reruns each such run ONCE (attempt 1
#   only), for a PR already set to auto-merge, so a real failure still shows
#   after the second attempt. A second attempt is rerun once more only when
#   the media tools install was the one step that failed (3.135.3 hung on a
#   flaky Jest run and then a trickling apt mirror), never for a test.
# - Approval and merge are bound to the release token's own work: the PR must
#   be opened by the token owner, every commit on it must be authored and
#   committed by the token owner, and the review (commit_id) and the merge
#   (--match-head-commit) name the head SHA that was checked. The hourly run
#   re-verifies the current head before it re-approves; a head carrying any
#   other commit gets no approval, its auto-merge is turned off, and the run
#   fails so a maintainer looks at it. A PR that cannot be read is left as
#   it is and only fails the run.

on:
  schedule:
    - cron: '0 18 * * *'
    # Re-approve and rerun only; keep in sync with REAPPROVE_SCHEDULE below.
    - cron: '40 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # The hourly run reruns a failed check run on the release PR.
  actions: write

jobs:
  merge-stable-release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Approve and enable auto-merge on the open stable release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PAT: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # No checkout — set the repo explicitly so gh works without a
          # git remote (same pattern as whatsnew, 2a5f0a8).
          GH_REPO: ${{ github.repository }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          REAPPROVE_SCHEDULE: '40 * * * *'
        run: |
          if [ -z "$RELEASE_PAT" ]; then
            echo "RELEASE_PLEASE_TOKEN not set — skipping (manual review required)."
            exit 0
          fi
          # Strict selection (review P1): this job runs daily even without a
          # stable push, and `gh pr list --head` matches the branch NAME only
          # — a fork PR can spoof `release-please--branches--stable`. Pin the
          # base to stable AND require a same-repo head (isCrossRepository
          # == false); a fork PR is cross-repository, so it can never be
          # picked and auto-merged with the privileged PAT.
          read -r count pr pr_author < <(gh pr list \
            --base stable \
            --head release-please--branches--stable \
            --state open \
            --json number,isCrossRepository,author \
            --jq '[.[] | select(.isCrossRepository == false)] | "\(length) \(.[0].number // "-") \(.[0].author.login // "-")"')
          if [ "$count" -eq 0 ]; then
            echo "No open same-repo stable release PR — nothing to cut today."
            exit 0
          fi
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one same-repo stable release PR, found $count — refusing to approve."
            exit 1
          fi
          pat_login=$(GH_TOKEN="$RELEASE_PAT" gh api user --jq .login)
          if [ -z "$pat_login" ] || [ "$pr_author" != "$pat_login" ]; then
            echo "::error::Stable release PR #$pr was opened by '$pr_author', not by the release token owner — refusing to approve."
            exit 1
          fi
          # Bind approval and merge to what the release token produced, not to
          # the branch name: every commit on the PR must be authored AND
          # committed by the token owner, and the review and the merge are tied
          # to the head SHA verified here, so a later push is not covered.
          # Returns 0 and prints the head SHA when it verifies, 1 when a commit
          # is from anyone else, 2 when the head moved while it was being read
          # (try again), 3 when the PR could not be read at all.
          verify_release_head() {
            local pr="$1" head commits count last foreign after
            head=$(gh pr view "$pr" --json headRefOid --jq .headRefOid) || return 3
            commits=$(gh api --paginate "repos/$GH_REPO/pulls/$pr/commits?per_page=100" \
              --jq '.[] | "\(.sha) \(.author.login // "-") \(.committer.login // "-")"') || return 3
            count=$(printf '%s\n' "$commits" | grep -c . || true)
            last=$(printf '%s\n' "$commits" | tail -n 1 | cut -d' ' -f1)
            foreign=$(printf '%s\n' "$commits" | awk -v login="$pat_login" 'NF && ($2 != login || $3 != login) { print $1 }')
            [ "$count" -gt 0 ] || return 3
            after=$(gh pr view "$pr" --json headRefOid --jq .headRefOid) || return 3
            if [ "$after" != "$head" ] || [ "$last" != "$head" ]; then
              return 2
            fi
            # The pulls commits endpoint stops at 250; a release PR has a handful.
            if [ -z "$pat_login" ] || [ -z "$head" ] || [ "$count" -ge 250 ]; then
              return 3
            fi
            if [ -n "$foreign" ]; then
              return 1
            fi
            echo "$head"
          }
          if [ "$EVENT_SCHEDULE" = "$REAPPROVE_SCHEDULE" ]; then
            # Hourly run: never starts a cut. Only a PR the daily run (or a
            # maintainer) set to auto-merge is touched: its dismissed
            # approval is given again, and a check run that failed or was
            # cancelled on its head is rerun once (twice for the apt step).
            read -r automerge decision head < <(gh pr view "$pr" --json autoMergeRequest,reviewDecision,headRefOid \
              --jq '[(.autoMergeRequest != null), (.reviewDecision // "NONE"), .headRefOid] | @tsv')
            if [ "$automerge" != "true" ]; then
              echo "Stable release PR #$pr is not set to auto-merge — no cut started, nothing to do."
              exit 0
            fi
            # Only the head the release token produced is approved again or
            # has its checks rerun.
            verified=0
            head=$(verify_release_head "$pr") || verified=$?
            if [ "$verified" = 2 ]; then
              echo "Stable release PR #$pr moved while it was being checked — trying again next hour."
              exit 0
            fi
            if [ "$verified" = 3 ]; then
              echo "::error::Could not read stable release PR #$pr — no re-approval this hour."
              exit 1
            fi
            if [ "$verified" != 0 ]; then
              GH_TOKEN="$RELEASE_PAT" gh pr merge "$pr" --disable-auto || true
              echo "::error::Stable release PR #$pr carries a commit not authored and committed by the release token owner — auto-merge turned off, no re-approval."
              exit 1
            fi
            if [ "$decision" != "APPROVED" ]; then
              gh api "repos/$GH_REPO/pulls/$pr/reviews" -f commit_id="$head" -f event=APPROVE \
                -f body="Automated re-approval — a push after the daily approval dismissed it." > /dev/null
              echo "Re-approved stable release PR #$pr at $head."
            fi
            # First attempts, plus second attempts whose only failed step is
            # the media tools install (an apt mirror, not the code): a run
            # that fails again otherwise is a real failure and stays for a
            # maintainer. The rerun fails the job when GitHub refuses it:
            # `set -e` does not reach the left side of `&&` or an `if`
            # condition, so a broken recovery would otherwise report success
            # while the release stays blocked.
            runs=$(gh run list --commit "$head" --event pull_request --limit 50 \
              --json databaseId,status,conclusion,attempt \
              --jq '.[] | select(.status == "completed" and .attempt <= 2 and (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")) | "\(.databaseId) \(.attempt)"')
            failed=0
            while read -r run attempt; do
              [ -n "$run" ] || continue
              if [ "$attempt" = 2 ]; then
                # The jobs endpoint lists the latest attempt by default.
                steps=$(gh api "repos/$GH_REPO/actions/runs/$run/jobs" \
                  --jq '[.jobs[].steps[]? | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | .name] | unique | .[]')
                if [ "$steps" != "Build the optional media process guard and install the media tools" ]; then
                  echo "Run $run failed again on its rerun — left for a maintainer."
                  continue
                fi
              fi
              if gh run rerun "$run" --failed; then
                echo "Reran the failed jobs of run $run (attempt $attempt) on stable release PR #$pr."
              else
                echo "::error::Could not rerun run $run on stable release PR #$pr."
                failed=1
              fi
            done <<< "$runs"
            exit "$failed"
          fi
          # A head that moves mid-check (release-please pushing) is checked
          # once more before giving up, so the day's cut is not lost to it.
          verified=0
          head=$(verify_release_head "$pr") || verified=$?
          if [ "$verified" = 2 ]; then
            sleep 30
            verified=0
            head=$(verify_release_head "$pr") || verified=$?
          fi
          if [ "$verified" = 2 ] || [ "$verified" = 3 ]; then
            echo "::error::Could not verify stable release PR #$pr (it moved or could not be read) — run this workflow again."
            exit 1
          fi
          if [ "$verified" != 0 ]; then
            echo "::error::Stable release PR #$pr carries a commit not authored and committed by the release token owner — refusing to approve."
            exit 1
          fi
          # Approve is tolerant — a pre-existing approval already satisfies
          # branch protection and re-approving can return non-zero. The review
          # names the verified head, so it does not cover a later push.
          gh api "repos/$GH_REPO/pulls/$pr/reviews" -f commit_id="$head" -f event=APPROVE \
            -f body="Automated approval — daily stable release batch (release-please version bump + changelog)." > /dev/null \
            || echo "::warning::approve returned non-zero (PR may already be approved)"
          # But the auto-merge enable is the load-bearing step: this scheduled
          # job is the ONLY automatic stable cut, so DON'T swallow its failure
          # (review P2) — an expired/under-scoped PAT would otherwise stop
          # releases while the workflow stays green.
          GH_TOKEN="$RELEASE_PAT" gh pr merge "$pr" --squash --auto --match-head-commit "$head"
          # `gh pr merge --auto` merges IMMEDIATELY when the required checks
          # are already green — the normal case at 18:00, since the fixes
          # merged hours earlier and CI passed. So success is EITHER the PR is
          # already merged OR an auto-merge request is now pending; only a PR
          # that is still open with no auto-merge request is a real failure
          # (expired/under-scoped PAT) worth failing the job on (review round 2).
          # One snapshot of both fields (review round 3): querying state and
          # autoMergeRequest separately races — auto-merge can complete
          # between the two calls, so the first sees OPEN and the second sees
          # the request already cleared on the now-merged PR → false failure.
          read -r state automerge < <(gh pr view "$pr" --json state,autoMergeRequest \
            --jq '[.state, (.autoMergeRequest != null)] | @tsv')
          if [ "$state" = "MERGED" ]; then
            echo "Stable release PR #$pr merged immediately (checks were already green)."
          elif [ "$automerge" = "true" ]; then
            echo "Auto-merge enabled on stable release PR #$pr — merges when checks are green."
          else
            echo "::error::stable release PR #$pr is still open with no auto-merge — check RELEASE_PLEASE_TOKEN scope/expiry."
            exit 1
          fi
